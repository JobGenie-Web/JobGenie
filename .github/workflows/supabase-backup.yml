name: Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'   # Every day at 2 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: npm install @supabase/supabase-js

      # ---- DATABASE TABLES ----
      # SUPABASE_DIRECT_URL must be the *direct* connection URL (not the pooler).
      # Find it in: Supabase Dashboard → Project Settings → Database
      #   → "Connection string" tab → URI (mode: "Session" or direct host, port 5432)
      # Example: postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres
      - name: Backup DB tables
        env:
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M)
          DUMP_FILE="db_backup_${DATE}.sql"

          # Plain SQL format (-Fp): human-readable, openable in any text editor.
          # --schema=public: only dump your app tables, skip Supabase internals.
          # --no-owner / --no-privileges: skip roles that don't exist on restore target.
          pg_dump "${SUPABASE_DIRECT_URL}" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --schema=public \
            -Fp \
            -f "${DUMP_FILE}"

          if [ ! -s "${DUMP_FILE}" ]; then
            echo "ERROR: Dump file is empty — pg_dump likely failed. Check the URL and credentials."
            exit 1
          fi

          echo "Backup complete: ${DUMP_FILE} ($(du -h "${DUMP_FILE}" | cut -f1))"

      # ---- STORAGE BUCKETS ----
      - name: Backup Storage Buckets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/backup-buckets.js

      # ---- UPLOAD ARTIFACT (retained 30 days) ----
      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: |
            *.sql
            bucket_backup/
          retention-days: 30
