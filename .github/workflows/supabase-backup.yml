name: Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'   # Every day at 2 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: npm install @supabase/supabase-js

      # ---- DATABASE TABLES ----
      - name: Backup DB tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M)
          # Use session-mode pooler URL (IPv4-compatible). sslmode=require is mandatory for pooler.
          pg_dump "${SUPABASE_DB_URL}" --clean --if-exists -Fc -f "db_backup_${DATE}.dump" \
            --no-password \
            -v 2>&1 | tail -5
          echo "Backup file: db_backup_${DATE}.dump"

      # ---- STORAGE BUCKETS ----
      - name: Backup Storage Buckets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/backup-buckets.js

      # ---- UPLOAD ARTIFACT (retained 30 days) ----
      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: |
            *.dump
            bucket_backup/
          retention-days: 30
